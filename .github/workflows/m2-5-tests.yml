name: M2.5 statistical and regression tests

on:
  push:
    branches: [m2.5-extension]
  pull_request:
    branches: [m2.5-extension]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install baseline and M2.5 dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-m2.5.txt
      - name: Run all tests
        run: |
          pytest -q --junitxml=m2.5-test-results.xml
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m2.5-test-results
          path: m2.5-test-results.xml
          if-no-files-found: warn
