[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "acp-deterministic-engine"
version = "1.1.0"
description = "ACP deterministic processing and longitudinal panel analytics lab"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "statsmodels>=0.14",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
